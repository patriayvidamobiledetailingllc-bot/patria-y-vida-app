<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patria y Vida | Square Sandbox Test</title><style>body{background:#101010;color:#fff;font:16px system-ui;margin:0;padding:25px}.wrap{max-width:520px;margin:auto}h1{color:#d7b47b;font-size:24px}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:9px;font:inherit}input{background:#222;border:1px solid #666;color:#fff}button{background:#d7b47b;border:0;margin-top:18px;font-weight:700}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#242424;padding:16px;border-radius:9px}small{color:#bbb}</style></head><body><div class="wrap"><h1>Square Sandbox Connection Test</h1><p>Administrator-only test. No payment or order will be created.</p><form id="login"><label for="email">Administrator email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="test" type="submit">Test Sandbox Connection</button></form><p id="status" role="status"></p><pre id="result" hidden></pre><small>Credentials are sent directly to your Supabase project over HTTPS. They are not displayed or sent to ChatGPT. This page does not save passwords.</small></div><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const url='https://uwnqixujbmftqzcvjfpw.supabase.co';
const key='sb_publishable_5F9HbgTARRJZOUOQhsvLtw_PyAaayX0';
const supabase=createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const form=document.getElementById('login'),button=document.getElementById('test'),status=document.getElementById('status'),result=document.getElementById('result');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='Testing securely…';result.hidden=true;try{const {data,error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw Error('Sign-in failed: '+error.message);const response=await fetch(url+'/functions/v1/square-sandbox-check',{method:'POST',headers:{'Authorization':'Bearer '+data.session.access_token,'apikey':key,'Content-Type':'application/json'},body:'{}'});const payload=await response.json().catch(()=>({error:'Invalid server response'}));status.textContent=response.ok&&payload.success!==false&&payload.ok!==false?'Connection test successful':'Connection test failed (HTTP '+response.status+')';result.textContent=JSON.stringify(payload,null,2);result.hidden=false;await supabase.auth.signOut();}catch(err){status.textContent='Test could not complete';result.textContent=err.message;result.hidden=false;}finally{document.getElementById('password').value='';button.disabled=false;}});
</script></body></html>
